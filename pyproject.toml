# ==============================================================================
# Build System Configuration
# Specifies Setuptools as the standard PEP 517 build backend.
# ==============================================================================
[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

# ==============================================================================
# Project Metadata & Core Dependencies
# Defines package metadata, Python version constraint, and runtime libraries
# for SEC EDGAR ingestion, financial analysis, NLP sentiment, orchestration, and API.
# ==============================================================================
[project]
name = "dager"
version = "0.1.0"
description = "Long-Term Investment Research & Decision Engine (6-month to 3-year horizon)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # HTTP & Web Scraping (SEC EDGAR, RSS, News)
    "httpx>=0.27.0",
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.12.3",
    # Data Validation & Configuration Management
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    # Market Price & Financial Data
    "yfinance>=0.2.40",
    # Relational Database & ORM (PostgreSQL / Supabase / SQLite)
    "sqlalchemy>=2.0.30",
    "psycopg2-binary>=2.9.9",
    # Workflow Orchestration (Daily S&P 500 & On-Demand Flows)
    "prefect>=2.19.0",
    # Web API & Server
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
]

# ==============================================================================
# Optional Dependencies
# Separates heavy ML/NLP packages (FinBERT) and developer testing tools so
# lightweight environments can install only what they need.
# ==============================================================================
[project.optional-dependencies]
nlp = [
    # FinBERT sentiment analysis runtime
    "transformers>=4.41.0",
    "torch>=2.3.0",
]
dev = [
    # Unit testing, linting, and type checking
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.4",
]

# ==============================================================================
# Package Discovery & Tool Settings
# Restricts package discovery to `dager` and configures Pytest & Ruff defaults.
# ==============================================================================
[tool.setuptools.packages.find]
include = ["dager*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

