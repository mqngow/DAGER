# ==============================================================================
# Cloud-Hosted Scheduled Prefect Pipeline (GitHub Actions)
# Runs DAGER's S&P 500 evaluation flow automatically in the cloud every day at
# 06:00 UTC (or manually via the "Run workflow" button) so your laptop never
# needs to stay on.
# ==============================================================================
name: Daily S&P 500 DAGER Pipeline

on:
  schedule:
    # Runs at 06:00 UTC every day
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of S&P 500 companies to evaluate (default: 50)"
        required: false
        default: "50"

jobs:
  run-prefect-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Check out repository code
      - name: Checkout DAGER repository
        uses: actions/checkout@v4

      # 2. Set up Python 3.12 with pip caching
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # 3. Install DAGER and dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # 4. Execute the Prefect S&P 500 batch flow against your cloud database
      # Configure these secrets in GitHub -> Settings -> Secrets and variables -> Actions
      - name: Run Prefect S&P 500 Evaluation Flow
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL }}
        run: |
          python -m flows.evaluation_flow --limit ${{ github.event.inputs.limit || '50' }}
